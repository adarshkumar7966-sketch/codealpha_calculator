
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #141e30, #243b55);
        }

        .calculator {
            width: 340px;
            padding: 25px;
            border-radius: 25px;
            background: #1c1c2b;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }

        h2 {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        #display {
            width: 100%;
            height: 75px;
            background: #303044;
            border: none;
            outline: none;
            border-radius: 12px;
            margin-bottom: 20px;
            padding: 15px;
            color: white;
            font-size: 30px;
            text-align: right;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            height: 60px;
            border: none;
            border-radius: 12px;
            background: #303044;
            color: white;
            font-size: 22px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #484866;
            transform: scale(1.05);
        }

        .operator {
            background: #ff9500;
        }

        .operator:hover {
            background: #e08700;
        }

        .clear {
            background: #e74c3c;
        }

        .clear:hover {
            background: #c0392b;
        }

        .equal {
            background: #16a085;
            grid-row: span 2;
            height: 132px;
        }

        .equal:hover {
            background: #138d75;
        }

        .zero {
            grid-column: span 2;
        }

        @media(max-width: 400px) {
            .calculator {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h2>CALCULATOR</h2>

        <input type="text" id="display"
               placeholder="0" readonly>

        <div class="buttons">

            <button class="clear" onclick="clearDisplay()">AC</button>
            <button onclick="deleteLast()">DEL</button>
            <button onclick="append('%')">%</button>
            <button class="operator" onclick="append('/')">÷</button>

            <button onclick="append('7')">7</button>
            <button onclick="append('8')">8</button>
            <button onclick="append('9')">9</button>
            <button class="operator" onclick="append('*')">×</button>

            <button onclick="append('4')">4</button>
            <button onclick="append('5')">5</button>
            <button onclick="append('6')">6</button>
            <button class="operator" onclick="append('-')">−</button>

            <button onclick="append('1')">1</button>
            <button onclick="append('2')">2</button>
            <button onclick="append('3')">3</button>
            <button class="operator" onclick="append('+')">+</button>

            <button onclick="append('0')" class="zero">0</button>
            <button onclick="append('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>

        </div>
    </div>

    <script>

        let display = document.getElementById("display");

        function append(value) {

            if (display.value === "Error") {
                display.value = "";
            }

            display.value += value;

            // Show live result
            showLiveResult();
        }

        function clearDisplay() {
            display.value = "";
        }

        function deleteLast() {
            display.value = display.value.slice(0, -1);
            showLiveResult();
        }

        function calculate() {

            try {

                let expression = display.value;

                if (!expression ||
                    !/^[0-9+\-*/%.()\s]+$/.test(expression)) {
                    return;
                }

                let result = Function(
                    '"use strict"; return (' + expression + ')'
                )();

                if (!Number.isFinite(result)) {
                    display.value = "Error";
                    return;
                }

                display.value = Number(result.toPrecision(12));

            } catch (error) {
                display.value = "Error";
            }
        }

        function showLiveResult() {

            // The expression is evaluated when the user types.
            // The display retains the expression until = is pressed.

            try {

                let expression = display.value;

                if (!expression ||
                    !/^[0-9+\-*/%.()\s]+$/.test(expression)) {
                    return;
                }

                let result = Function(
                    '"use strict"; return (' + expression + ')'
                )();

                if (Number.isFinite(result)) {
                    console.log("Live Result:", result);
                }

            } catch (error) {
                // Incomplete expressions are allowed while typing.
            }
        }

        // Keyboard Support

        document.addEventListener("keydown", function(event) {

            if (/^[0-9+\-*/%.()]$/.test(event.key)) {
                append(event.key);
            }

            else if (event.key === "Enter" ||
                     event.key === "=") {
                event.preventDefault();
                calculate();
            }

            else if (event.key === "Backspace") {
                deleteLast();
            }

            else if (event.key === "Escape") {
                clearDisplay();
            }

        });

    </script>

</body>
</html>
